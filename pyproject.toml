[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-storm-hi02"
version = "0.1.0"
description = "Multilingual citizen grievance chatbot backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15,<2",
    "apscheduler>=3.11,<4",
    "bcrypt>=4.2,<5",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "scikit-learn>=1.5,<2",
    "sqlmodel>=0.0.24,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
training = [
    "accelerate>=0.30,<2",
    "sentencepiece>=0.2,<1",
    "torch>=2.2,<3",
    "transformers>=4.46,<5",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
"grievance.nlp.templates" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
pythonpath = ["backend/src", "ml/src"]

[tool.ruff]
line-length = 100
src = ["backend/src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["backend/src", "ml/src"]
strict = true

# The supported scikit-learn package does not publish a py.typed marker.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# APScheduler 3 does not ship a py.typed marker.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

# NumPy 2.5 stubs use Python 3.12 syntax while this project targets Python 3.11.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
