[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-storm-hi02"
version = "0.1.0"
description = "Multilingual citizen grievance chatbot backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15,<2",
    "apscheduler>=3.11,<4",
    "bcrypt>=4.2,<5",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlmodel>=0.0.24,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
"grievance.nlp.templates" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
src = ["backend/src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["backend/src"]
strict = true
