repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check backend/src backend/tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check backend/src backend/tests
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python -m mypy backend/src
        language: system
        types: [python]
        pass_filenames: false
